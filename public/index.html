<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penguin Chatbot</title>
<script>
window.MathJax = {
    loader: { load: ["ui/safe"] },
    tex: { inlineMath: [["$", "$"]], displayMath: [["$$", "$$"]], processEscapes: true },
    options: { safeOptions: { allow: { URLs: "none", classes: "none", cssIDs: "none", styles: "none" } } },
};
</script>
<script id="mathjax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-chtml.js"></script>
<style>
body {
    --page-gutter: clamp(8px, 3vw, 16px);
    --layout-gap: clamp(8px, 2vw, 18px);
    --content-width: min(calc(100vw - (var(--page-gutter) * 2)), 704px);
    --penguin-width: clamp(104px, calc((var(--content-width) - var(--layout-gap)) * 0.3), 206px);
    --chat-width: calc(var(--content-width) - var(--penguin-width) - var(--layout-gap));
    --panel-height: clamp(186px, calc(var(--penguin-width) * 224 / 125), 370px);
    font-family: Arial;
    background:#f5f5f5;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin:0;
    padding:0;
}
.page-title {
    position:absolute;
    top:0;
    left:calc((100% - var(--content-width)) / 2);
    z-index:2;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:12px 18px;
    border:1px solid rgba(0, 76, 153, 0.12);
    border-radius:999px;
    background:rgba(255, 255, 255, 0.92);
    box-shadow:0 10px 26px rgba(0, 0, 0, 0.08);
    backdrop-filter:blur(10px);
}
.page-title::before {
    content:"";
    width:10px;
    height:10px;
    border-radius:50%;
    background:linear-gradient(135deg, #0066cc, #00a0e9);
    box-shadow:0 0 0 6px rgba(0, 102, 204, 0.08);
}
.page-title-text {
    font-size:24px;
    font-weight:700;
    letter-spacing:0.04em;
    color:#103b66;
    line-height:1;
    text-transform:lowercase;
}
.container {
    position:relative;
    box-sizing:border-box;
    max-width:820px;
    width:100%;
    margin-top:32px;
    padding:72px var(--page-gutter) 16px;
}
.main-layout {
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    gap:var(--layout-gap);
    width:var(--content-width);
    margin:0 auto;
}
#penguin-container { position:relative; width:var(--penguin-width); height:var(--panel-height); flex:0 0 var(--penguin-width);}
#penguin-body, #penguin-mouth { width:100%; height:100%; display:block;}
#penguin-mouth { position:absolute; left:58%; top:39.0625%; width:24%; height:14.5089%; transform-origin:50% 50%; pointer-events:none;}
.chat-column { flex:0 0 var(--chat-width); width:var(--chat-width); display:flex; flex-direction:column; gap:8px;}
.chat-panel { width:100%; max-width:none; height:var(--panel-height); display:flex; flex-direction:column;}
.credit-note { margin-top:6px; font-size:clamp(11px, 2.4vw, 13px); line-height:1.5; color:#4d6174;}
.mouth-moving { animation: talk 0.3s infinite;}
@keyframes talk {0%,100%{transform:scaleY(1);}50%{transform:scaleY(1.5);}}
#chat {width:100%; flex:1; min-height:0; border:1px solid #ccc; background:#fff; padding:10px; overflow-y:auto; margin-bottom:10px; box-sizing:border-box;}
.message.user {text-align:right; color:#004488;}
.message.bot {text-align:left; color:#0a7722;}
.message { white-space:pre-wrap; overflow-wrap:anywhere; margin-bottom:10px; line-height:1.5; }
.message mjx-container[display="true"] { overflow-x:auto; max-width:100%; padding-bottom:4px; }
.message.bot a{color:#0a5cbf; text-decoration:underline; word-break:break-all;}
.message.bot details{margin-top:6px; font-size:0.92em;}
.message.bot summary{cursor:pointer; color:#0a5cbf;}
.abstract-original{margin-top:4px; color:#333; white-space:pre-wrap; line-height:1.5;}
.source-note{margin-top:6px; font-size:0.85em; color:#4d6174;}
#send-btn:disabled{background:#9bbad6; cursor:default;}
.input-row { display:flex; width:100%; gap:clamp(6px, 2vw, 10px);}
#user-input {flex:1; min-width:0; padding:clamp(8px, 2.4vw, 10px); font-size:clamp(14px, 3.5vw, 16px); box-sizing:border-box;}
#send-btn {flex:0 0 clamp(58px, 24%, 80px); padding:clamp(8px, 2.4vw, 10px); font-size:clamp(14px, 3.5vw, 16px); margin-left:0; background:#0066cc; color:#fff; border:none; border-radius:4px; cursor:pointer;}
#send-btn:hover {background:#004c99;}
@media (max-width: 860px) {
    .page-title {
        left:calc((100% - var(--content-width)) / 2);
        padding:10px 14px;
    }
    .page-title-text { font-size:20px; }
    .container { margin-top:24px; padding-top:64px; }
}
</style>
</head>
<body>
<div class="container">
    <div class="page-title" aria-label="p-chan bot title">
        <span class="page-title-text">p-chan bot</span>
    </div>
    <div class="main-layout">
        <div id="penguin-container">
            <img id="penguin-body" src="penguin_body.png" alt="Penguin body">
            <img id="penguin-mouth" src="mouth.png" alt="Penguin mouth">
        </div>
        <div class="chat-column">
            <div class="chat-panel">
            <div id="chat"></div>
            <div class="input-row">
        <input type="text" id="user-input" placeholder="質問を入力…">
        <button id="send-btn">送信</button>
            </div>
            </div>
            <br>
            <br>
            <div class="credit-note">Secretary Tanaka drew the penguin, and Kaito Kobayashi built the chatbot.</div>
        </div>
    </div>
</div>

<script>
const mouth = document.getElementById('penguin-mouth');
const chat = document.getElementById('chat');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
let isSending = false;

function replyLanguage(message){
    if(/^\s*(?:(?:please|can you|could you|would you)\s+)?(?:what|when|where|who|why|how|tell|show|explain|prove|define|compute|calculate)\b/iu.test(message)) return "en";
    return /[\u3040-\u30ff]/u.test(message) || (/[\u3400-\u9fff]/u.test(message) && !/[a-z]{2,}/iu.test(message)) ? "ja" : "en";
}

function renderMath(element){
    if(window.MathJax?.typesetPromise){
        window.MathJax.typesetPromise([element]).then(()=>{
            chat.scrollTop = chat.scrollHeight;
        }).catch(error=>console.error("Math rendering failed", error));
    }
}
document.getElementById("mathjax-script").addEventListener("load", ()=>{
    window.MathJax.startup.promise.then(()=>renderMath(chat));
});

// 本文を安全に描画(URLだけ<a>化、それ以外はtextNode=XSS防止)
function appendLinkedText(parent, text){
    const parts = String(text).split(/(https?:\/\/[^\s、。）)]+)/gu);
    for(const part of parts){
        if(/^https?:\/\//.test(part)){
            try{
                const u = new URL(part);
                if(u.protocol === "http:" || u.protocol === "https:"){
                    const a = document.createElement("a");
                    a.href = u.href; a.textContent = part;
                    a.target = "_blank"; a.rel = "noopener noreferrer";
                    parent.appendChild(a);
                    continue;
                }
            }catch(_){ /* fall through to text */ }
        }
        parent.appendChild(document.createTextNode(part));
    }
}

function appendMessage(role, text, abstracts, sources, checkedAt, language = "ja"){
    const div = document.createElement('div');
    div.className = `message ${role}`;
    if(role === "user"){
        div.textContent = text;                  // ユーザー入力はリンク化しない
    }else{
        appendLinkedText(div, text);
        if(Array.isArray(abstracts)){            // 要旨があれば原文を折りたたみで添える
            for(const ab of abstracts){
                if(ab.abstractMissing || !ab.original) continue;
                const d = document.createElement("details");
                const s = document.createElement("summary");
                s.textContent = language === "en" ? `Original abstract (${ab.dateLabel})` : `要旨の原文を見る（${ab.dateLabel}）`;
                const body = document.createElement("div");
                body.className = "abstract-original";
                appendLinkedText(body, ab.original);
                d.appendChild(s); d.appendChild(body);
                div.appendChild(d);
            }
        }
        if(Array.isArray(sources) && sources.length){
            const note = document.createElement("div");
            note.className = "source-note";
            note.appendChild(document.createTextNode(language === "en" ? "Source: " : "出典: "));
            for(const source of sources){
                try{
                    const url = new URL(source.url);
                    if(!["http:", "https:"].includes(url.protocol) || url.username || url.password) continue;
                    const link = document.createElement("a");
                    link.href = url.href;
                    link.textContent = source.title || (language === "en" ? "Official website" : "公式サイト");
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    if(note.childNodes.length > 1) note.appendChild(document.createTextNode(" · "));
                    note.appendChild(link);
                }catch(_){ /* ignore invalid source links */ }
            }
            const checked = new Date(checkedAt || "");
            if(Number.isFinite(checked.getTime())){
                const label = language === "en" ? "Data checked" : "データ確認";
                note.appendChild(document.createTextNode(` · ${label}: ${checked.toLocaleString(language === "en" ? "en-GB" : "ja-JP", { timeZone: "Asia/Tokyo" })} JST`));
            }
            div.appendChild(note);
        }
    }
    chat.appendChild(div);
    if(role === "bot") renderMath(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

async function askChatGPT(message){
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 60000);  // フォールバック無し方針=60s
    try{
        const res = await fetch("/chat",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({message}),
            signal: controller.signal,
        });
        if(!res.ok){
            const data = await res.json().catch(()=>({}));
            const err = new Error(data.error || `HTTP ${res.status}`);
            err.status = res.status;
            throw err;
        }
        return await res.json();
    } finally {
        clearTimeout(timer);
    }
}

async function handleSend(){
    if(isSending) return;                         // 二重送信防止
    const message = input.value.trim();
    if(!message) return;
    const language = replyLanguage(message);
    isSending = true; sendBtn.disabled = true;
    appendMessage("user", message);
    input.value = "";
    mouth.classList.add('mouth-moving');          // 応答が返るまで口パク継続(固定3秒タイマー廃止)

    const typing = appendMessage("bot", language === "en" ? "Thinking…" : "考え中…");
    const slowTimer = setTimeout(()=>{ typing.textContent = language === "en" ? "Still working on your question…" : "もう少し待っててね…"; }, 3000);

    try{
        const data = await askChatGPT(message);
        clearTimeout(slowTimer);
        typing.remove();
        appendMessage("bot", data.reply || (language === "en" ? "I couldn't produce an answer. Please try again." : "うまくお返事できなかったの。ごめんね。"), data.abstract, data.sources, data.checkedAt, data.language || language);
    }catch(e){
        clearTimeout(slowTimer);
        typing.remove();
        const msg = language === "en"
            ? (e.name === "AbortError" ? "The reply took too long. Please try again." : "I couldn't send your question. Please try again shortly.")
            : (e.name === "AbortError")
            ? "ごめんね、お返事に時間がかかりすぎちゃったみたい。もう一度試してね。"
            : "ごめんね、うまくお返事できなかったの。少し時間をおいて試してね。";
        appendMessage("bot", msg);
        console.error(e);                          // 生エラーは画面に出さずログのみ
    }finally{
        mouth.classList.remove('mouth-moving');
        isSending = false; sendBtn.disabled = false;
        input.focus();
    }
}

sendBtn.addEventListener("click", handleSend);
input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    if (e.isComposing || e.keyCode === 229) return;
    handleSend();
});
</script>
</body>
</html>

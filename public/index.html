<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penguin Chatbot</title>
<style>
body {
    --panel-height: 340px;
    --penguin-width: 190px;
    --chat-width: 440px;
    --layout-gap: 16px;
    font-family: Arial;
    background:#f5f5f5;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin:0;
    padding:0;
}
.page-title {
    position:absolute;
    top:0;
    left:calc((100% - (var(--penguin-width) + var(--chat-width) + var(--layout-gap))) / 2);
    z-index:2;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:12px 18px;
    border:1px solid rgba(0, 76, 153, 0.12);
    border-radius:999px;
    background:rgba(255, 255, 255, 0.92);
    box-shadow:0 10px 26px rgba(0, 0, 0, 0.08);
    backdrop-filter:blur(10px);
}
.page-title::before {
    content:"";
    width:10px;
    height:10px;
    border-radius:50%;
    background:linear-gradient(135deg, #0066cc, #00a0e9);
    box-shadow:0 0 0 6px rgba(0, 102, 204, 0.08);
}
.page-title-text {
    font-size:24px;
    font-weight:700;
    letter-spacing:0.04em;
    color:#103b66;
    line-height:1;
    text-transform:lowercase;
}
.container {
    position:relative;
    box-sizing:border-box;
    max-width:760px;
    width:100%;
    margin-top:32px;
    padding:72px 16px 16px;
}
.main-layout { display:flex; align-items:flex-start; justify-content:center; gap:var(--layout-gap);}
#penguin-container { position:relative; width:var(--penguin-width); height:var(--panel-height); flex:0 0 var(--penguin-width);}
#penguin-body, #penguin-mouth { width:100%; height:100%; display:block;}
#penguin-mouth { position:absolute; left:58%; top:39.0625%; width:24%; height:14.5089%; transform-origin:50% 50%; pointer-events:none;}
.chat-panel { flex:1; max-width:var(--chat-width); width:100%; height:var(--panel-height); display:flex; flex-direction:column;}
.mouth-moving { animation: talk 0.3s infinite;}
@keyframes talk {0%,100%{transform:scaleY(1);}50%{transform:scaleY(1.5);}}
#chat {width:100%; flex:1; min-height:0; border:1px solid #ccc; background:#fff; padding:10px; overflow-y:auto; margin-bottom:10px; box-sizing:border-box;}
.message.user {text-align:right; color:#004488;}
.message.bot {text-align:left; color:#0a7722;}
.input-row { display:flex; width:100%;}
#user-input {width:calc(100% - 100px); padding:10px; font-size:16px; box-sizing:border-box;}
#send-btn {width:80px; padding:10px; font-size:16px; margin-left:10px; background:#0066cc; color:#fff; border:none; border-radius:4px; cursor:pointer;}
#send-btn:hover {background:#004c99;}
@media (max-width: 860px) {
    body {
        --panel-height: clamp(240px, calc(100vh - 260px), 340px);
        --penguin-width: calc(var(--panel-height) * 125 / 224);
    }
    .page-title {
        left:calc((100% - var(--penguin-width)) / 2);
        padding:10px 14px;
    }
    .page-title-text { font-size:20px; }
    .container { margin-top:24px; padding-top:64px; }
    .main-layout { flex-direction:column; align-items:center;}
    .chat-panel { max-width:var(--chat-width);}
}
</style>
</head>
<body>
<div class="container">
    <div class="page-title" aria-label="p-chan bot title">
        <span class="page-title-text">p-chan bot</span>
    </div>
    <div class="main-layout">
        <div id="penguin-container">
            <img id="penguin-body" src="penguin_body.png" alt="Penguin body">
            <img id="penguin-mouth" src="mouth.png" alt="Penguin mouth">
        </div>
        <div class="chat-panel">
            <div id="chat"></div>
            <div class="input-row">
        <input type="text" id="user-input" placeholder="質問を入力…">
        <button id="send-btn">送信</button>
            </div>
        </div>
    </div>
</div>

<script>
const mouth = document.getElementById('penguin-mouth');
const chat = document.getElementById('chat');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

function appendMessage(role, text){
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function startMouthMovement(duration){
    mouth.classList.add('mouth-moving');
    setTimeout(()=>mouth.classList.remove('mouth-moving'), duration);
}

async function askChatGPT(message){
    const res = await fetch("/chat",{ 
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message})
    });

    if(!res.ok){
        const data = await res.json().catch(()=>({}));
        throw new Error(data.error || `HTTP ${res.status}`);
    }

    const data = await res.json();
    return data.reply;
}

async function handleSend(){
    const message = input.value.trim();
    if(!message) return;
    appendMessage("user", message);
    input.value="";
    startMouthMovement(3000);
    try{
        const reply = await askChatGPT(message);
        appendMessage("bot", reply);
    }catch(e){
        appendMessage("bot",`すみません、応答できませんでした。${e.message ? ` (${e.message})` : ""}`);
    }
}

sendBtn.addEventListener("click", handleSend);
input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    if (e.isComposing || e.keyCode === 229) return;
    handleSend();
});
</script>
</body>
</html>

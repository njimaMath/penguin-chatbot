<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penguin Chatbot</title>
<style>
body {
    --page-gutter: clamp(8px, 3vw, 16px);
    --layout-gap: clamp(8px, 2vw, 18px);
    --content-width: min(calc(100vw - (var(--page-gutter) * 2)), 704px);
    --penguin-width: clamp(104px, calc((var(--content-width) - var(--layout-gap)) * 0.3), 206px);
    --chat-width: calc(var(--content-width) - var(--penguin-width) - var(--layout-gap));
    --panel-height: clamp(186px, calc(var(--penguin-width) * 224 / 125), 370px);
    font-family: Arial;
    background:#f5f5f5;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin:0;
    padding:0;
}
.page-title {
    position:absolute;
    top:0;
    left:calc((100% - var(--content-width)) / 2);
    z-index:2;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:12px 18px;
    border:1px solid rgba(0, 76, 153, 0.12);
    border-radius:999px;
    background:rgba(255, 255, 255, 0.92);
    box-shadow:0 10px 26px rgba(0, 0, 0, 0.08);
    backdrop-filter:blur(10px);
}
.page-title::before {
    content:"";
    width:10px;
    height:10px;
    border-radius:50%;
    background:linear-gradient(135deg, #0066cc, #00a0e9);
    box-shadow:0 0 0 6px rgba(0, 102, 204, 0.08);
}
.page-title-text {
    font-size:24px;
    font-weight:700;
    letter-spacing:0.04em;
    color:#103b66;
    line-height:1;
    text-transform:lowercase;
}
.container {
    position:relative;
    box-sizing:border-box;
    max-width:820px;
    width:100%;
    margin-top:32px;
    padding:72px var(--page-gutter) 16px;
}
.main-layout {
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    gap:var(--layout-gap);
    width:var(--content-width);
    margin:0 auto;
}
#penguin-container { position:relative; width:var(--penguin-width); height:var(--panel-height); flex:0 0 var(--penguin-width);}
#penguin-body, #penguin-mouth { width:100%; height:100%; display:block;}
#penguin-mouth { position:absolute; left:58%; top:39.0625%; width:24%; height:14.5089%; transform-origin:50% 50%; pointer-events:none;}
.chat-column { flex:0 0 var(--chat-width); width:var(--chat-width); display:flex; flex-direction:column; gap:8px;}
.chat-panel { width:100%; max-width:none; height:var(--panel-height); display:flex; flex-direction:column;}
.credit-note { margin-top:6px; font-size:clamp(11px, 2.4vw, 13px); line-height:1.5; color:#4d6174;}
.mouth-moving { animation: talk 0.3s infinite;}
@keyframes talk {0%,100%{transform:scaleY(1);}50%{transform:scaleY(1.5);}}
#chat {width:100%; flex:1; min-height:0; border:1px solid #ccc; background:#fff; padding:10px; overflow-y:auto; margin-bottom:10px; box-sizing:border-box;}
.message.user {text-align:right; color:#004488;}
.message.bot {text-align:left; color:#0a7722;}
.input-row { display:flex; width:100%; gap:clamp(6px, 2vw, 10px);}
#user-input {flex:1; min-width:0; padding:clamp(8px, 2.4vw, 10px); font-size:clamp(14px, 3.5vw, 16px); box-sizing:border-box;}
#send-btn {flex:0 0 clamp(58px, 24%, 80px); padding:clamp(8px, 2.4vw, 10px); font-size:clamp(14px, 3.5vw, 16px); margin-left:0; background:#0066cc; color:#fff; border:none; border-radius:4px; cursor:pointer;}
#send-btn:hover {background:#004c99;}
@media (max-width: 860px) {
    .page-title {
        left:calc((100% - var(--content-width)) / 2);
        padding:10px 14px;
    }
    .page-title-text { font-size:20px; }
    .container { margin-top:24px; padding-top:64px; }
}
</style>
</head>
<body>
<div class="container">
    <div class="page-title" aria-label="p-chan bot title">
        <span class="page-title-text">p-chan bot</span>
    </div>
    <div class="main-layout">
        <div id="penguin-container">
            <img id="penguin-body" src="penguin_body.png" alt="Penguin body">
            <img id="penguin-mouth" src="mouth.png" alt="Penguin mouth">
        </div>
        <div class="chat-column">
            <div class="chat-panel">
            <div id="chat"></div>
            <div class="input-row">
        <input type="text" id="user-input" placeholder="質問を入力…">
        <button id="send-btn">送信</button>
            </div>
            </div>
            <br>
            <br>
            <div class="credit-note">Secretary Tanaka drew the penguin, and Kaito Kobayashi built the chatbot.</div>
        </div>
    </div>
</div>

<script>
const mouth = document.getElementById('penguin-mouth');
const chat = document.getElementById('chat');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

function appendMessage(role, text){
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function startMouthMovement(duration){
    mouth.classList.add('mouth-moving');
    setTimeout(()=>mouth.classList.remove('mouth-moving'), duration);
}

async function askChatGPT(message){
    const res = await fetch("/chat",{ 
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message})
    });

    if(!res.ok){
        const data = await res.json().catch(()=>({}));
        throw new Error(data.error || `HTTP ${res.status}`);
    }

    const data = await res.json();
    return data.reply;
}

async function handleSend(){
    const message = input.value.trim();
    if(!message) return;
    appendMessage("user", message);
    input.value="";
    startMouthMovement(3000);
    try{
        const reply = await askChatGPT(message);
        appendMessage("bot", reply);
    }catch(e){
        appendMessage("bot",`すみません、応答できませんでした。${e.message ? ` (${e.message})` : ""}`);
    }
}

sendBtn.addEventListener("click", handleSend);
input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    if (e.isComposing || e.keyCode === 229) return;
    handleSend();
});
</script>
</body>
</html>

name: Daily HP Update

on:
  schedule:
    - cron: '0 0 * * *' # 毎日、日本時間の午前9時(UTC 0:00)に実行
  workflow_dispatch:      # GitHub上で手動実行できるボタンも追加

# 約40日間 push が 403 で失敗し更新が止まっていた根本原因の修正:
# GITHUB_TOKEN は既定で read-only のため、明示的に書き込み権限を付与する。
permissions:
  contents: write
  issues: write

concurrency:
  group: daily-hp-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run Scrape
        run: node scrape.js   # サニティNG時は exit 1 で停止し、壊れた data.txt で上書きしない

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.txt freshness.json
          if git diff --cached --quiet; then
            echo "差分なし。コミットをスキップします。"
            exit 0
          fi
          # [skip ci] は必須(落とすと push が自分自身を再トリガし無限ループになる)
          git commit -m "Auto-update HP info [skip ci]"
          for i in 1 2 3; do
            git fetch origin main
            git pull --rebase origin main && git push origin main && exit 0
            echo "push 失敗 (試行 $i / 3) — リトライします"
            sleep 5
          done
          echo "::error::push に3回失敗しました"
          exit 1

      # 再発防止: 失敗が約40日間気づかれなかったため、失敗時に通知 issue を起票する
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠️ Daily HP Update が失敗 ($(date -u +%Y-%m-%d))" \
            --body "Daily HP Update ワークフローが失敗しました。ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          || echo "issue 作成に失敗。ログを確認してください: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
